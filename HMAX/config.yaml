  bootstrapDiscomax: 'https://default.any-any.prd.api.discomax.com/session-context/headwaiter/v1/bootstrap'

drm:
  include_clearkey: true
  playready_security_level: 'SL2000'

playback_features:
  - 'mlp'

license_fallback:
  widevine: 'https://busy.any-any.prd.api.discomax.com/drm-proxy/any/drm-proxy/drm/license/widevine'
  playready: 'https://busy.any-any.prd.api.discomax.com/drm-proxy/any/drm-proxy/drm/license/play-ready'

signin_url: 'https://www.hbomax.com/signin'

